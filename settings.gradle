pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

// paper-api for 26.x is built for Java 25, so the build needs a Java 25
// toolchain even when the machine only ships an older JDK.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

include("core")
include("paper")

rootProject.name = "concerto"
